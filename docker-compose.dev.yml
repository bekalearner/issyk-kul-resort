services:
  postgres:
    ports:
      - "5433:5432"

  app:
    build:
      target: build
    command: npm run dev
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://${PG_USER}:${PG_PASSWORD}@postgres:5432/${PG_DB}
    volumes:
      - ./src:/app/src
      - ./views:/app/views
      - ./public:/app/public
      - ./prisma:/app/prisma
      - uploads:/app/public/uploads
